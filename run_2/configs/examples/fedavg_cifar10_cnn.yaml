# FedAvg + CIFAR-10 + CNN: 4-node star topology (1 aggregator + 3 workers)
#
# A more demanding validation experiment than MNIST/MLP.  CIFAR-10 is the
# standard FL benchmark (McMahan et al., 2017).  The small CNN (~591K
# params) needs ~100 rounds to converge, taking roughly 5 minutes on
# commodity CPU hardware.
#
# Expected convergence:
#   Round  10 → ~50% val accuracy
#   Round  30 → ~60% val accuracy
#   Round  50 → ~65% val accuracy
federation:
  num_nodes: 4
  roles:
    0: aggregator

  topology:
    edges:
      # Worker 1 ↔ Aggregator
      - src: 1
        dst: 0
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 0
        dst: 1
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      # Worker 2 ↔ Aggregator
      - src: 2
        dst: 0
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 0
        dst: 2
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      # Worker 3 ↔ Aggregator
      - src: 3
        dst: 0
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 0
        dst: 3
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }

traffic_classes:
  num_classes: 1
  dscp_mapping:
    0: 0

training:
  dataset:
    name: cifar10
    partition:
      strategy: iid
      seed: 42
  model: cnn
  algorithm: fedavg
  epochs_per_round: 1
  total_rounds: 50
  batch_size: 64
  learning_rate: 0.01
  optimizer: sgd
  sync_timeout: 300.0
  update_mode: monolithic
  importance_metric: null

monitoring:
  tensorboard: true
  tensorboard_port: 6006
  report_output: ./results/
