# Async D-PSGD: 4-node ring topology, monolithic updates
#
# Nodes train and communicate asynchronously — no global round barrier.
# Each node sends to all neighbors after each local epoch, and aggregates
# with any received updates (non-blocking).  Updates older than 5
# iterations are discarded (staleness_threshold).  Validation runs
# every 5 iterations to reduce overhead.
federation:
  num_nodes: 4
  roles: {}

  topology:
    edges:
      # Ring: 0↔1, 1↔2, 2↔3, 3↔0
      - src: 0
        dst: 1
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 1
        dst: 0
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 1
        dst: 2
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 2
        dst: 1
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 2
        dst: 3
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 3
        dst: 2
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 3
        dst: 0
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
      - src: 0
        dst: 3
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }

traffic_classes:
  num_classes: 1
  dscp_mapping:
    0: 0

training:
  dataset:
    name: mnist
    partition:
      strategy: iid
      seed: 42
  model: mlp
  algorithm: adpsgd
  epochs_per_round: 1
  total_rounds: 20
  batch_size: 64
  learning_rate: 0.01
  optimizer: sgd
  update_mode: monolithic
  importance_metric: null
  staleness_threshold: 5
  eval_every: 5

monitoring:
  tensorboard: true
  tensorboard_port: 6006
  report_output: ./results/
