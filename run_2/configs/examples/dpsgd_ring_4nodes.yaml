# Example: 4-node ring topology with D-PSGD on MNIST
#
# Topology: 0 <-> 1 <-> 2 <-> 3 <-> 0 (ring)
# Algorithm: D-PSGD (synchronous, decentralized)
# Dataset: MNIST (IID partitioning)
# Model: Simple MLP (784 -> 200 -> 200 -> 10)

federation:
  num_nodes: 4
  roles: {}  # All nodes are peers in D-PSGD

  topology:
    edges:
      # 0 <-> 1
      - src: 0
        dst: 1
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
          1: { bandwidth_mbps: 500,  latency_ms: 10, drop_rate: 0.01 }
      - src: 1
        dst: 0
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
          1: { bandwidth_mbps: 500,  latency_ms: 10, drop_rate: 0.01 }
      # 1 <-> 2
      - src: 1
        dst: 2
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
          1: { bandwidth_mbps: 500,  latency_ms: 10, drop_rate: 0.01 }
      - src: 2
        dst: 1
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
          1: { bandwidth_mbps: 500,  latency_ms: 10, drop_rate: 0.01 }
      # 2 <-> 3
      - src: 2
        dst: 3
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
          1: { bandwidth_mbps: 500,  latency_ms: 10, drop_rate: 0.01 }
      - src: 3
        dst: 2
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
          1: { bandwidth_mbps: 500,  latency_ms: 10, drop_rate: 0.01 }
      # 3 <-> 0
      - src: 3
        dst: 0
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
          1: { bandwidth_mbps: 500,  latency_ms: 10, drop_rate: 0.01 }
      - src: 0
        dst: 3
        classes:
          0: { bandwidth_mbps: 1000, latency_ms: 5, drop_rate: 0.0 }
          1: { bandwidth_mbps: 500,  latency_ms: 10, drop_rate: 0.01 }

traffic_classes:
  num_classes: 2
  dscp_mapping:
    0: 46   # EF (Expedited Forwarding)
    1: 10   # AF11

training:
  dataset:
    name: mnist
    partition:
      strategy: iid
      seed: 42
  model: mlp
  algorithm: dpsgd
  epochs_per_round: 1
  total_rounds: 50
  batch_size: 64
  learning_rate: 0.01
  optimizer: sgd
  update_mode: monolithic
  importance_metric: null

monitoring:
  tensorboard: true
  tensorboard_port: 6006
  report_output: ./results/
