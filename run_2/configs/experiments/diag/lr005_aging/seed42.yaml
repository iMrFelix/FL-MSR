traffic_classes:
  num_classes: 3
  dscp_mapping:
    0: 46
    1: 10
    2: 0
training:
  dataset:
    name: cifar10
    partition:
      strategy: dirichlet
      alpha: 0.1
      seed: 42
  model: deep_cnn
  algorithm: fedavg
  epochs_per_round: 1
  total_rounds: 50
  batch_size: 64
  learning_rate: 0.05
  optimizer: sgd
  momentum: 0.0
  update_mode: per_layer
  epsilon_deadline: 0.3
  epsilon_warmup_rounds: 0
  importance_metric_v2: delta_sq_norm
  assignment_strategy: coverage_eft
  late_layer_policy: recycle_last_delta
  aging_mode: additive_capped
  watchdog_factor: 3.0
  global_eval: true
  aging_lambda: 0.5
  aging_tau_max: 3
monitoring:
  tensorboard: false
  report_output: ./results/
