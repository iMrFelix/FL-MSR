traffic_classes:
  # Transport substrate only — FedLUAR has no QoS notion (see header).
  num_classes: 3
  dscp_mapping:
    0: 46   # EF
    1: 10   # AF11
    2: 0    # Best-effort

training:
  dataset:
    name: femnist
    partition:
      strategy: natural   # PREFER CODE: LEAF per-writer non-IID (NOT Dirichlet)
      seed: 42
      max_writers: 132    # [APPROX] first-128-LEAF-writers; 10-shard overlap not replicated
  model: femnist_cnn      # FedLUAR/LEAF reference CNN (6,603,710 params) — NOT femnist_cnn_distributed
  algorithm: fedavg
  epochs_per_round: 1     # [APPROX] FedLUAR tau=20 local STEPS; we count epochs (no step knob)
  total_rounds: 200       # FedLUAR: 200 communication rounds
  batch_size: 20          # FedLUAR Table 6
  learning_rate: 0.01     # FedLUAR Table 6 (constant base; lr=0.1 compensation NO LONGER needed)
  optimizer: sgd          # FedLUAR Table 6
  momentum: 0.9           # FedLUAR Table 6 — now honored (schema.py:156 -> generator.py:303 -> engine.py:458)
  update_mode: per_layer  # required for layer-granular recycling

  # --- FedLUAR recycling (THE mechanism) ---
  skip_feedback: "off"          # delta=0 plain-FedAvg baseline: recycling OFF (all layers sent every round)
  skip_fedluar_count: 2           # FedLUAR Table 16: delta=2 of 4 kernels
  late_layer_policy: recycle_last_delta   # theta + last aggregated delta (FedLUAR Eq.3-5)

  # --- OUR extensions: ALL DISARMED (pure FedLUAR, NOT our epsilon/QoS/aging ideas) ---
  epsilon_deadline: 0.0           # OFF: disables our coverage-deadline trigger (the headline mechanism)
  epsilon_warmup_rounds: 0        # moot at eps=0
  assignment_strategy: byte_balanced   # QoS-route-but-never-drop (no shedding); AVOID coverage_eft
  importance_metric_v2: delta_sq_norm  # frozen default; does not gate completion at eps=0
  importance_metric: null         # legacy, ignored in per_layer mode
  aging_mode: none                # our starvation control OFF (matches code)
  aging_lambda: 0.0               # off
  aging_tau_max: 0                # off (code has no staleness cap)
  watchdog_factor: 0.0            # our G4 watchdog disabled (moot at eps=0)
  cyclic_k: 0                     # N/A (cyclic strategy unused)

monitoring:
  report_output: ./results/
  tensorboard: false
  tensorboard_port: 6006
