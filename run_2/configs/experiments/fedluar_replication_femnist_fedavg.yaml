# =============================================================================
# FedLUAR FEMNIST faithful replication
# =============================================================================
# Reproduces the FedLUAR FEMNIST experiment (Lee et al., "FedLUAR: Layer
# Recycling", NeurIPS 2025) in this framework, using the framework's
# explicitly-labelled FedLUAR-native baseline (skip_feedback=fedluar) with
# ALL of our epsilon-coverage-deadline / QoS-shedding / aging extensions
# DISARMED.  This is PURE FedLUAR layer recycling, isolated from our ideas.
#
# Each "<-- FedLUAR ..." tag cites the authoritative source for the value.
# "[APPROX]" flags a faithfulness gap from the unreplicable list; the note
# explains the gap and why this value is the closest faithful choice.
#
# ------------------------------- MODEL / DATA --------------------------------
#   model              femnist_cnn        <-- FedLUAR Table 1 / LEAF reference.
#                          The 4-weight-layer CNN: Conv2D(32,5x5)->MaxPool->
#                          Conv2D(64,5x5)->MaxPool->Flatten->Dense(2048)->
#                          Dense(62,logits).  EXACTLY 6,603,710 params
#                          (src/models/femnist_cnn.py:61); 6.6M x 4B x 32
#                          clients = 806.11 MiB = FedLUAR Table 1 server mem.
#                          dense_0/kernel = 97.3% of bytes (single-dominant
#                          -layer regime).  NOT femnist_cnn_distributed (the
#                          1.2M-param Phase-2 redesign, which is NOT FedLUAR).
#   dataset            femnist            <-- FEMNIST, 62-class LEAF.
#   partition          natural            <-- PREFER CODE.  Official FedLUAR
#                          code partitions FEMNIST by LEAF writer
#                          (feeder_femnist.py), NOT Dirichlet, and ignores
#                          config.alpha for FEMNIST.  The PAPER's claimed
#                          Dirichlet(alpha=0.1) (App. A.3) contradicts the
#                          code and is rejected by src/datasets/femnist.py.
#   partition seed     42                 <-- reproducibility seed.
#   max_writers        128                <-- [APPROX] code loads the first
#                          128 LEAF writers.  Our natural partition assigns
#                          DISJOINT whole writers; the code additionally
#                          concatenates each client's shard with the next 9
#                          writers' shards (10-shard overlap,
#                          feeder_femnist.py:56-61) — that overlap is NOT
#                          replicated (unreplicable list).
#
# ------------------------- FEDERATION (CLIENTS) ------------------------------
#   num_nodes          33                 <-- [APPROX] 32 workers + 1
#                          aggregator.  FedLUAR samples 32 of 128 clients per
#                          round (App. A.3: num_workers=32, active_ratio=0.25).
#                          Our framework has NO client-sampling knob (FedAvg
#                          is FULL participation: aggregator barrier fires
#                          only when all neighbors report).  We realise the
#                          "32 active clients/round" as 32 always-on workers;
#                          the 128-client pool with per-round random
#                          32-subsampling is NOT supported (unreplicable list).
#   clients_per_round  32 (full)          <-- realised as 32 always-on
#                          workers.  No client_fraction/clients_per_round
#                          field exists in the schema.
#   aggregation        weighted FedAvg    <-- [APPROX] FedLUAR averages
#                          UNWEIGHTED over the 32 workers (MPI allreduce SUM /
#                          num_workers, fedluar.py:98).  Our
#                          _aggregate_as_aggregator is SAMPLE-SIZE WEIGHTED
#                          (n_k/N); under imbalanced natural writer shards
#                          weighted != unweighted.  Closest no-code-change
#                          approximation (unreplicable list).
#
# ------------------------------- OPTIMIZER -----------------------------------
#   epochs_per_round   1                  <-- [APPROX] FedLUAR uses tau=20
#                          local mini-batch STEPS/round (paper Table 6 + code
#                          agree).  Our framework counts local EPOCHS (full
#                          passes), not steps — there is NO local-step knob.
#                          1 epoch over a writer's shard != 400 sample-visits
#                          (20 steps x batch 20).  Single largest local-
#                          compute faithfulness gap (unreplicable list).
#   batch_size         20                 <-- FedLUAR Table 6.
#   optimizer          sgd                <-- tf.keras.optimizers.SGD.
#   learning_rate      0.01               <-- FedLUAR Table 6 (constant base).
#                          The FedLUAR-matched 0.01 is correct NOW that
#                          momentum=0.9 is actually honored by the engine
#                          (schema field schema.py:156 -> generator flatten
#                          generator.py:303 -> SGD plumbing engine.py:458).
#                          Do NOT use the legacy lr=0.1 momentum-faking
#                          compensation (that was only valid while momentum
#                          was silently dropped).
#   momentum           0.9                <-- FedLUAR Table 6.  Now reaches
#                          SGD via the 3-hop fix above.
#   weight_decay       (none)             <-- PREFER CODE effective value = 0.
#                          Paper Table 6 + code config say 1e-4, but the
#                          code's FEMNIST CNN never attaches the L2
#                          regularizer (model.py:244-264) so effective L2 = 0
#                          for FEMNIST; our engine also applies none.  No
#                          field added — absence is correct.
#   lr_schedule        constant 0.01      <-- [APPROX] FedLUAR step-decays
#                          x0.1 at rounds {100,150} (lr: 0.01 -> 0.001 ->
#                          0.0001).  No LR-schedule knob exists; constant
#                          0.01 is the closest no-change approximation
#                          (unreplicable list).
#   total_rounds       200                <-- FedLUAR: 200 communication
#                          rounds.
#   loss               (engine-owned)     <-- engine uses
#                          SparseCategoricalCrossentropy(from_logits=True),
#                          numerically equivalent to the code's
#                          CategoricalCrossentropy(from_logits=True) given
#                          integer labels.  Head outputs logits.
#
# --------------------- FedLUAR RECYCLING (THE MECHANISM) ---------------------
#   update_mode        per_layer          <-- required for layer-granular
#                          recycling.
#   skip_feedback      fedluar            <-- THE faithful FedLUAR mechanism
#                          (fedavg.py:781-806).  Each round the aggregator
#                          samples EXACTLY k layers WITHOUT replacement with
#                          prob proportional to 1/(||Delta_l||/||theta_l||),
#                          advises that identical set to every worker; advised
#                          workers OMIT those layers next round; the aggregator
#                          recycle-fills each omitted (layer,source) with
#                          theta + last aggregated delta.  This is FedLUAR
#                          Alg.2 / Eq.1-5 (s=||Delta||/||w||, p=recip(s)/sum,
#                          np.random.choice(replace=False,p), prev_params +
#                          prev_updates).  Round 1 is plain FedAvg (last_delta
#                          is None); recycling active from round 2 — matches
#                          the paper (R_0 empty).
#   skip_fedluar_count 2                  <-- FedLUAR Table 16 "delta=2 of 4
#                          layers".  The 4 recyclable layers are the 4 ndim>1
#                          kernels (conv_0,conv_1,dense_0,head); biases
#                          (ndim==1) are never recycled and always sent.
#                          Code default 12 is the CIFAR/ResNet20 value and
#                          would crash on FEMNIST (cannot draw 12 of 4); k is
#                          clamped to L-1=3 internally so >=1 kernel always
#                          transmits.  2 is valid.
#   late_layer_policy  recycle_last_delta <-- recycle-fill rule: an
#                          omitted/missing (layer,source) is filled with
#                          local_params[layer] + last_delta[layer]
#                          (fedavg.py:417-423,558-571 = FedLUAR Eq.3-5 stale-
#                          delta reuse).  Under skip_feedback=fedluar the
#                          advised omissions are recycle-filled regardless of
#                          this policy; set explicitly for clarity.
#
# -------------- OUR EXTENSIONS — ALL DISARMED (NOT FedLUAR) -------------------
#   epsilon_deadline       0.0     <-- CRITICAL.  Disables our coverage-
#                          deadline trigger (check_coverage returns None,
#                          engine.py:296-298); completion reverts to the COUNT
#                          trigger (all transmitted layers in).  Neutralizes
#                          our headline mechanism.  Layer omission then comes
#                          ONLY from the FedLUAR skip advice.
#   epsilon_warmup_rounds  0       <-- moot at eps=0.
#   assignment_strategy    byte_balanced  <-- "QoS-route-but-never-drop":
#                          head=ALL assigned layers, tail=EMPTY regardless of
#                          eps (assignment.py:580-638, "no shedding") = the
#                          unambiguous "all layers always sent" choice.  AVOID
#                          coverage_eft (our min-t_eps shed scheduler).  The
#                          only layer omission is the FedLUAR skip advice, not
#                          assignment shedding.
#   importance_metric_v2   delta_sq_norm  <-- frozen default; with eps=0 it
#                          only orders layers across classes, never gates
#                          completion.  The recycle SELECTION uses the fedluar
#                          sampler's own ||Delta||/||theta|| ratio
#                          (fedavg.py:797), independent of this knob.
#   importance_metric      null    <-- legacy, ignored in per_layer mode.
#   aging_mode             none    <-- our starvation control OFF.  Official
#                          code has NO aging on recycle selection; FedLUAR
#                          starvation is by-design.  Matches code AND isolates
#                          pure FedLUAR from our extension.
#   aging_lambda           0.0     <-- off.
#   aging_tau_max          0       <-- off; no must-send override (code has no
#                          staleness cap, Sec.3.3 "does not specify the upper
#                          bound of k").
#   watchdog_factor        0.0     <-- our G4 watchdog only fires under a live
#                          coverage trigger; moot at eps=0.  <=0 fully
#                          disables (engine.py:1103).
#   cyclic_k               0       <-- N/A (only used by assignment=cyclic).
#
# ------------------- TRAFFIC SUBSTRATE (transport-only) ----------------------
#   FedLUAR has NO QoS notion; the 3 traffic classes are purely our transport
#   substrate (committed 3-class 60/30/10 Mbps topology).  Since
#   assignment_strategy=byte_balanced never sheds and the FedLUAR skip is the
#   only omission, multi-class routing is transport-only and does NOT alter FL
#   semantics.  60/30/10 Mbps is 10x the DeepCNN prelim grid because the model
#   is ~35x larger (the 24.5 MiB dense kernel drains in ~3.4 s on class 0).
#
# Validate (do NOT train here):
#   python -c "from src.config.schema import load_config; \
#       print(load_config('configs/experiments/fedluar_replication_femnist.yaml'))"
# =============================================================================

federation:
