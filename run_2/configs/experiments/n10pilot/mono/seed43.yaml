federation:
  num_nodes: 10
  roles:
    0: aggregator
  topology:
    edges:
    - src: 1
      dst: 0
      classes: &id001
        0:
          bandwidth_mbps: 10
          latency_ms: 5
          drop_rate: 0.0
    - src: 0
      dst: 1
      classes: *id001
    - src: 2
      dst: 0
      classes: *id001
    - src: 0
      dst: 2
      classes: *id001
    - src: 3
      dst: 0
      classes: *id001
    - src: 0
      dst: 3
      classes: *id001
    - src: 4
      dst: 0
      classes: *id001
    - src: 0
      dst: 4
      classes: *id001
    - src: 5
      dst: 0
      classes: *id001
    - src: 0
      dst: 5
      classes: *id001
    - src: 6
      dst: 0
      classes: *id001
    - src: 0
      dst: 6
      classes: *id001
    - src: 7
      dst: 0
      classes: *id001
    - src: 0
      dst: 7
      classes: *id001
    - src: 8
      dst: 0
      classes: *id001
    - src: 0
      dst: 8
      classes: *id001
    - src: 9
      dst: 0
      classes: *id001
    - src: 0
      dst: 9
      classes: *id001
traffic_classes:
  num_classes: 1
  dscp_mapping:
    0: 0
training:
  dataset:
    name: cifar10
    partition:
      strategy: dirichlet
      alpha: 0.1
      seed: 43
  model: deep_cnn
  algorithm: fedavg
  epochs_per_round: 1
  total_rounds: 20
  batch_size: 64
  learning_rate: 0.1
  optimizer: sgd
  momentum: 0.0
  global_eval: true
  update_mode: monolithic
monitoring:
  tensorboard: false
  report_output: ./results/
