federation:
  num_nodes: 4
  roles:
    0: aggregator
  topology:
    edges:
    - src: 1
      dst: 0
      classes:
        0:
          bandwidth_mbps: 10
          latency_ms: 5
          drop_rate: 0.0
    - src: 0
      dst: 1
      classes:
        0:
          bandwidth_mbps: 10
          latency_ms: 5
          drop_rate: 0.0
    - src: 2
      dst: 0
      classes:
        0:
          bandwidth_mbps: 10
          latency_ms: 5
          drop_rate: 0.0
    - src: 0
      dst: 2
      classes:
        0:
          bandwidth_mbps: 10
          latency_ms: 5
          drop_rate: 0.0
    - src: 3
      dst: 0
      classes:
        0:
          bandwidth_mbps: 10
          latency_ms: 5
          drop_rate: 0.0
    - src: 0
      dst: 3
      classes:
        0:
          bandwidth_mbps: 10
          latency_ms: 5
          drop_rate: 0.0
traffic_classes:
  num_classes: 1
  dscp_mapping:
    0: 0
training:
  dataset:
    name: cifar10
    partition:
      strategy: dirichlet
      alpha: 0.1
      seed: 45
  model: deep_cnn
  algorithm: fedavg
  epochs_per_round: 1
  total_rounds: 50
  batch_size: 64
  learning_rate: 0.15
  optimizer: sgd
  momentum: 0.0
  update_mode: monolithic
  global_eval: true
monitoring:
  tensorboard: false
  report_output: ./results/
